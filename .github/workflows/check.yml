name: check

on: [push, pull_request]

# The gate only reads the tree. Nothing here needs a writable token, and a
# public repository is where an over-scoped one costs something.
permissions:
  contents: read

# Supersede an in-flight run when a PULL REQUEST is pushed again, and leave
# branch runs alone.
#
# The obvious form, `group: <workflow>-${{ github.ref }}` with
# cancel-in-progress, is wrong here and was committed in that form earlier
# today. This workflow triggers on push as well as pull_request, so keying on
# the ref also groups branch runs, and a second push to main then CANCELS the
# first commit's run. That commit is left with no verdict of its own, which
# matters because the resume protocol requires checking CI rather than assuming
# it, and a cancelled run is not a green one.
#
# Keying a branch run by its own run id means it can never collide, so branch
# runs neither cancel each other nor queue behind each other.
#
# Taken from the keleusma repository, which recorded the same defect after
# losing verification runs to it.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # **The whole history, because one check is derived from it.**
      # word_provenance rebuilds when each word entered the lexicon by
      # walking every revision of it. The default single-commit checkout
      # leaves that check unable to answer, and it reported 141 words as
      # stale that had simply left the lexicon.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # There is no lockfile, so the cache has to be keyed on the only file
      # that states a dependency. Left unset it matches nothing, and a cache
      # that never invalidates serves a stale environment after a dependency
      # changes, which is the silent-partial-coverage failure in another
      # costume.
      # Pinned exactly, unlike the other two, because setup-uv publishes no
      # floating major tag past v7 while its current release is v10.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyright resolves optional dependencies from `.venv`, so the gate
      # cannot type-check the trainer without one. Without this step CI
      # reported torch as unresolvable and was red for an entire session
      # while the local gate was green.
      - name: Create the environment the gate type-checks against
        run: |
          uv venv
          uv pip install -e ".[train]"
      - name: Run the gate
        run: ./tools/check.sh
