[project]
name = "epagoge"
version = "0.0.0"
description = "A graded synthetic corpus and curriculum for training a falsification-oriented foundation model."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "LICENSE-CC0"]
authors = [{ name = "Brendan Sechter", email = "sgeos@hotmail.com" }]

# UNRESOLVED. The system interpreter is 3.14.7. Machine learning wheel
# availability for 3.14 has not been verified, so the floor is set at
# 3.12 and no exact interpreter is pinned. Resolve before adding the
# first dependency. See docs/decisions/PYTHON_VERSION.md.
requires-python = ">=3.12"

# The core stays dependency-free. Everything under src/epagoge/ other than
# the pilot trainer imports only the standard library, so the concept graph,
# the record schema, and the variance analysis can be validated in any
# environment.
dependencies = []

[project.optional-dependencies]
# Only the pilot trainer needs these. Install with: uv pip install -e ".[train]"
train = ["torch==2.14.0", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epagoge"]

[tool.ruff]
line-length = 88
src = ["src", "generators", "evals", "tools"]

[tool.ruff.lint]
# Chosen to serve the project's stated rigor requirements. E and F are
# the baseline, B catches likely bugs, S is the security ruleset, ANN
# requires annotations, and RET/SIM are readability passes.
select = ["E", "F", "W", "B", "S", "I", "N", "UP", "ANN", "RET", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# S311 flags the standard pseudo-random generator as unsuitable for
# cryptography. That is correct and irrelevant here. The experimental control
# must be reproducible from a declared seed, which is precisely the property a
# cryptographic generator does not offer. Nothing in this project uses random
# numbers for a security purpose; if that ever changes, this exemption must be
# narrowed rather than widened.
"tests/*" = ["S311"]
# The pilot and its runner draw from a seeded generator throughout, for the
# same reason: an experiment must be reproducible from a declared seed, which
# is the property a cryptographic generator does not offer.
"src/epagoge/pilot.py" = ["S311"]
# The ordering arms of the ablation are drawn from a declared seed, for
# the same reason. A run that cannot be reproduced measures nothing.
"tools/train_level.py" = ["S311"]
"src/epagoge/variance.py" = ["S311"]
"tools/run_pilot.py" = ["S311"]
# The corpus builder shuffles book order for the ablation's control arm,
# which must be reproducible from a declared seed for the same reason.
"tools/build_corpus.py" = ["S311"]
# The audit sample must be reproducible from a declared seed so a disputed
# rate can be re-checked against the same records.
"src/epagoge/review.py" = ["S311"]

[tool.pyright]
# Resolve optional dependencies from the project environment so that the
# trainer type-checks without torch being a hard requirement of the gate.
venvPath = "."
venv = ".venv"
# Strict mode is a deliberate compensation for Python's weaker static
# guarantees relative to the rest of this operator's toolchain. Every
# boundary that ingests model output is expected to validate through a
# declared schema rather than pass dictionaries.
include = ["src", "generators", "evals", "tools"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "evals", "src"]
